# Envoy front-proxy for vLLM Semantic Router
# Listens :8899 (OpenAI-compatible) → ext_proc router (gRPC :50051) → injects x-selected-model → routes to tier backend
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
  - name: http_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8899
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  time: "%START_TIME%"
                  path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                  response_code: "%RESPONSE_CODE%"
                  selected_model: "%REQ(X-SELECTED-MODEL)%"
                  upstream: "%UPSTREAM_CLUSTER%"
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              request_headers_to_remove:
              - "x-vsr-looper-request"
              - "x-vsr-looper-secret"
              - "x-vsr-looper-decision"
              - "x-vsr-looper-iteration"
              routes:
              # Sep 21 2026: local-qwen route now points at MOA gateway
              # hermes-agent @ 127.0.0.1:8642 (was SGLang qwen38 on
              # :11434, then qwen3-30b on :11435 earlier the same day).
              # The ext_proc router sets x-selected-model after classification;
              # this rule must sit BEFORE the catch-all below because Envoy
              # matches routes top-down and the catch-all swallows everything.
              # Authorization header is REQUIRED for MOA — use the same
              # API_SERVER_KEY that the systemd proxies use (see
              # ~/.hermes/.env and the systemd drop-ins at
              # ~/.config/systemd/user/*/moa-local.conf).
              - match:
                  prefix: "/"
                  headers:
                  - name: "x-selected-model"
                    string_match:
                      exact: "local-qwen"
                route:
                  cluster: local_vllm_cluster
                  timeout: 300s
                  host_rewrite_literal: "127.0.0.1"
              # All other tier requests → 9Router (semantic router ext_proc classification already happened on gRPC :50051)
              - match:
                  prefix: "/"
                request_headers_to_add:
                - header:
                    key: "Authorization"
                    value: "Bearer <<<REDACTED-OPENAI-STYLE-KEY>>>"
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                route:
                  cluster: ninerouter_cluster
                  timeout: 300s
                  host_rewrite_literal: "127.0.0.1"
          http_filters:
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service:
                envoy_grpc:
                  cluster_name: extproc_service
              allow_mode_override: true
              processing_mode:
                request_header_mode: "SEND"
                response_header_mode: "SEND"
                request_body_mode: "BUFFERED"
                response_body_mode: "NONE"
                request_trailer_mode: "DEFAULT"
                response_trailer_mode: "DEFAULT"
              failure_mode_allow: true
              message_timeout: 60s
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              suppress_envoy_headers: true
          stream_idle_timeout: "300s"
          request_timeout: "300s"
          common_http_protocol_options:
            idle_timeout: "300s"

  clusters:
  # Router ExtProc gRPC service
  - name: extproc_service
    connect_timeout: 30s
    type: STATIC
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options:
            connection_keepalive:
              interval: 60s
              timeout: 30s
    load_assignment:
      cluster_name: extproc_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 50051

  # Local MOA gateway (hermes-agent @ :8642) — primary free-tier on the Spark
  # Sep 21 2026: was SGLang qwen3-30b-a3b-instruct-2507 NVFP4 + MoE at :11435,
  # which was itself the successor to qwen38-27b-abliterated @ :11434 (Sep 19).
  # Container is hermes-agent; MOA gateway runs as user `hermes` on the Spark.
  # The SGLang qwen3-30b-a3b container is kept alive as the in-cluster backup.
  # Sep 21 2026: container binds on Tailscale address 127.0.0.1 too, but Envoy
  # also listens on the host network so 127.0.0.1 reachability works.
  - name: local_vllm_cluster
    connect_timeout: 30s
    type: STATIC
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: local_vllm_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 8642
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http_protocol_options: {}

  # 9Router gateway (GLM/Kimi/Claude via subscription auth)
  - name: ninerouter_cluster
    connect_timeout: 30s
    type: STATIC
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: ninerouter_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 20128
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http_protocol_options: {}

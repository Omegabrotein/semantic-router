# Envoy front-proxy for vLLM Semantic Router
# Listens :8899 (OpenAI-compatible) → ext_proc router (gRPC :50051) → injects x-selected-model → routes to tier backend
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
  - name: http_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8899
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  time: "%START_TIME%"
                  path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                  response_code: "%RESPONSE_CODE%"
                  selected_model: "%REQ(X-SELECTED-MODEL)%"
                  upstream: "%UPSTREAM_CLUSTER%"
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              request_headers_to_remove:
              - "x-vsr-looper-request"
              - "x-vsr-looper-secret"
              - "x-vsr-looper-decision"
              - "x-vsr-looper-iteration"
              routes:
              # Sep 9 2026: local-qwen38 → sglang container, NOT 9Router.
              # The ext_proc router sets x-selected-model after classification;
              # this rule must sit BEFORE the catch-all below because Envoy
              # matches routes top-down and the catch-all swallows everything.
              # No Authorization header is injected here: the sglang container
              # runs with api_key=None and rejects nothing, while the 9Router
              # bearer below is meaningless to it.
              - match:
                  prefix: "/"
                  headers:
                  - name: "x-selected-model"
                    string_match:
                      exact: "local-qwen38"
                route:
                  cluster: local_vllm_cluster
                  timeout: 300s
                  host_rewrite_literal: "127.0.0.1"
              # All other tier requests → 9Router (semantic router ext_proc classification already happened on gRPC :50051)
              - match:
                  prefix: "/"
                request_headers_to_add:
                - header:
                    key: "Authorization"
                    value: "Bearer <<<REDACTED-OPENAI-STYLE-KEY>>>"
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                route:
                  cluster: ninerouter_cluster
                  timeout: 300s
                  host_rewrite_literal: "127.0.0.1"
          http_filters:
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service:
                envoy_grpc:
                  cluster_name: extproc_service
              allow_mode_override: true
              processing_mode:
                request_header_mode: "SEND"
                response_header_mode: "SEND"
                request_body_mode: "BUFFERED"
                response_body_mode: "NONE"
                request_trailer_mode: "DEFAULT"
                response_trailer_mode: "DEFAULT"
              failure_mode_allow: true
              message_timeout: 60s
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              suppress_envoy_headers: true
          stream_idle_timeout: "300s"
          request_timeout: "300s"
          common_http_protocol_options:
            idle_timeout: "300s"

  clusters:
  # Router ExtProc gRPC service
  - name: extproc_service
    connect_timeout: 30s
    type: STATIC
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options:
            connection_keepalive:
              interval: 60s
              timeout: 30s
    load_assignment:
      cluster_name: extproc_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 50051

  # Local SGLang (qwen38-27b-abliterated, NVFP4 + DFlash2) — free
  # Sep 9 2026: repointed from the dead vLLM FP8 path (127.0.0.1:8001) to the
  # sglang-qwen38-nvfp4 container. That container binds ONLY the Tailscale
  # address, so 127.0.0.1 does not reach it — use 127.0.0.1 explicitly.
  - name: local_vllm_cluster
    connect_timeout: 30s
    type: STATIC
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: local_vllm_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 11434
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http_protocol_options: {}

  # 9Router gateway (GLM/Kimi/Claude via subscription auth)
  - name: ninerouter_cluster
    connect_timeout: 30s
    type: STATIC
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: ninerouter_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 20128
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http_protocol_options: {}
